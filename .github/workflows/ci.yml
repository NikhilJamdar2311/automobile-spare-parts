name: CI

on:
    push:
        branches:
            - main
            - feature/**
    pull_request:
        branches:
            - main

jobs:
    quality-check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Debug Node and npm
              run: |
                node --version
                npm --version
                npm config get package-lock
                npm config get legacy-peer-deps
                npm config get install-links

            - name: Debug package manifests
              run: |
                npm ls swagger-jsdoc yaml || true
                npm explain yaml || true

            - name: Verify lockfile
              run: |
                node -e "const p=require('./package-lock.json'); console.log('lockfileVersion:', p.lockfileVersion); console.log('has yaml:', Object.keys(p.packages || {}).filter(x => x.includes('yaml'))); console.log('has swagger-jsdoc:', Object.keys(p.packages || {}).filter(x => x.includes('swagger-jsdoc')))"

            - name: Install dependencies
              run: npm ci

            - name: Run project checks
              run: npm run check
