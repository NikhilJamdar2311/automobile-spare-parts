name: CI

on:
    push:
        branches:
            - main
            - feature/**
    pull_request:
        branches:
            - main

jobs:
    quality-check:
        runs-on: ubuntu-latest

        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 24
                  cache: npm

            - name: Install dependencies
              run: npm ci

            - name: Run project checks
              run: npm run check
